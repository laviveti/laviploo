version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: laviploo-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laviploo}
      POSTGRES_USER: ${POSTGRES_USER:-laviploo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-laviploo} -d ${POSTGRES_DB:-laviploo}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - laviploo-prod-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: laviploo-app-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-laviploo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-laviploo}?schema=public"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      PLOOMES_API_URL: ${PLOOMES_API_URL}
      PLOOMES_API_KEY: ${PLOOMES_API_KEY}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - laviploo-prod-network

volumes:
  postgres_prod_data:

networks:
  laviploo-prod-network:
    driver: bridge